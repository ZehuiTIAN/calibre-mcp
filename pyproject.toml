[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre-mcp"
version = "0.3.0"
description = "MCP server that gives AI assistants (Claude, Cursor, ...) read and write access to a local Calibre ebook library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zehui Tian", email = "tianzehui0623@gmail.com" }]
keywords = ["calibre", "mcp", "ebook", "books", "claude", "library"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
calibre-mcp = "calibre_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ocr = ["pymupdf>=1.24", "anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/calibre_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a local calibre installation and touches a temporary library",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
